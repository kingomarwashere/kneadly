name = "alisa"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "alisa"
database_id = "27d53702-8b03-4183-99c7-d63a3a155dd6"

# Canonical home for the Alisa brand.
[[routes]]
pattern = "alisa.bored.investments"
custom_domain = true

# Old Kneadly homes kept alive so existing links (incl. Google Maps) 301 across
# to alisa.bored.investments; the worker still serves /webhooks + /api on these
# hosts for not-yet-repointed integrations.
[[routes]]
pattern = "kneadly.bored.investments"
custom_domain = true

[[routes]]
pattern = "kneadly.theradicalparty.com"
custom_domain = true

# Daily reminder run at 22:00 UTC (~08:00 AEST) — emails customers whose
# confirmed appointment is ~1 day away (runReminders in src/lib/email.js).
[triggers]
crons = ["0 22 * * *"]

[vars]
BASE_URL = "https://alisa.bored.investments"
# Sender for transactional emails (Resend). bored.investments is a verified
# Resend domain; RESEND_API_KEY is a Worker secret (wrangler secret put).
EMAIL_FROM = "Alisa <bookings@bored.investments>"
